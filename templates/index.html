<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="color-scheme" content="light dark" />
</head>
<body class="bg-slate-50">
    <div class="max-w-3xl mx-auto p-6">
        <div class="bg-white rounded-xl shadow-md p-6">
            <h1 class="text-2xl font-semibold text-slate-800 mb-4">📝 Text Summarizer</h1>

            <label class="block text-sm font-medium text-slate-600 mb-2">Enter your text to summarize:</label>
            <textarea id="text" class="w-full h-48 p-3 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none" placeholder="Paste your long text here..."></textarea>

            <div class="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
                <select id="lengthPreset" class="border border-slate-200 rounded-lg p-2">
                    <option value="">Auto length</option>
                    <option value="short">Short</option>
                    <option value="medium">Medium</option>
                    <option value="long">Long</option>
                </select>
                <input id="minLength" type="number" placeholder="Min length (tokens)" class="border border-slate-200 rounded-lg p-2">
                <input id="maxLength" type="number" placeholder="Max length (tokens)" class="border border-slate-200 rounded-lg p-2">
            </div>
            <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-3">
                <input id="numSentences" type="number" placeholder="Limit to N sentences (optional)" class="border border-slate-200 rounded-lg p-2">
                <input id="numBeams" type="number" placeholder="Num beams (e.g., 8)" class="border border-slate-200 rounded-lg p-2">
            </div>

            <div class="mt-4 flex items-center gap-3">
                <button id="summarizeBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition disabled:opacity-50">Generate Summary</button>
                <span id="status" class="text-sm text-slate-500"></span>
            </div>

            <div id="errorBox" class="hidden mt-4 p-3 rounded-lg bg-red-50 text-red-700 border border-red-200"></div>

            <div id="resultBox" class="hidden mt-6">
                <h2 class="text-lg font-semibold text-slate-800 mb-2">Summary</h2>
                <div id="summaryText" class="p-4 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 whitespace-pre-wrap"></div>
            </div>
        </div>
    </div>

    <script>
      const btn = document.getElementById('summarizeBtn');
      const input = document.getElementById('text');
      const statusEl = document.getElementById('status');
      const errorBox = document.getElementById('errorBox');
      const resultBox = document.getElementById('resultBox');
      const summaryText = document.getElementById('summaryText');
      const stats = document.getElementById('stats') || document.createElement('div');
      stats.id = 'stats';
      resultBox?.appendChild(stats);

      function applyPreset(preset) {
        const minEl = document.getElementById('minLength');
        const maxEl = document.getElementById('maxLength');
        if (preset === 'short') { minEl.value = 10; maxEl.value = 40; }
        else if (preset === 'medium') { minEl.value = 20; maxEl.value = 80; }
        else if (preset === 'long') { minEl.value = 40; maxEl.value = 160; }
      }
      document.getElementById('lengthPreset')?.addEventListener('change', (e) => applyPreset(e.target.value));

      async function summarize() {
        errorBox.classList.add('hidden');
        resultBox.classList.add('hidden');
        statusEl.textContent = 'Summarizing...';
        btn.disabled = true;

        try {
          const minLength = parseInt(document.getElementById('minLength')?.value || '') || null;
          const maxLength = parseInt(document.getElementById('maxLength')?.value || '') || null;
          const numSentences = parseInt(document.getElementById('numSentences')?.value || '') || null;
          const numBeams = parseInt(document.getElementById('numBeams')?.value || '') || null;

          const res = await fetch('/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              text: input.value,
              min_length: minLength,
              max_length: maxLength,
              num_beams: numBeams,
              num_sentences: numSentences
            })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) {
            throw new Error(data.error || `HTTP ${res.status}`);
          }
          summaryText.textContent = data.summary || String(data);
          resultBox.classList.remove('hidden');
          const inputWords = (input.value || '').trim().split(/\s+/).filter(Boolean).length;
          const outWords = (summaryText.textContent || '').trim().split(/\s+/).filter(Boolean).length;
          stats.textContent = `Input: ${inputWords} words → Summary: ${outWords} words (min=${data?.used_params?.min_length ?? '-'}, max=${data?.used_params?.max_length ?? '-'})`;
        } catch (e) {
          errorBox.textContent = e.message || 'Unknown error';
          errorBox.classList.remove('hidden');
        } finally {
          statusEl.textContent = '';
          btn.disabled = false;
        }
      }

      btn.addEventListener('click', summarize);
    </script>
</body>
</html>
